spring:
  multipart:
    enable: true
    max-file-size: 10MB
    max-request-size: 10MB
# Puerto opcional para backend
server:
  port: 5000

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
management:
  debug: true
info:
